<td>{{ item_data.typ or 'aur' }}</td>
<td class="col-trunc">
  {% if item_data.typ != 'custom' %}
  <a href="https://aur.archlinux.org/packages/{{ item_name }}" target="_blank" rel="noopener">{{ item_data.source_url or '—' }}</a>
  {% else %}
  (custom PKGBUILD)
  {% endif %}
</td>
<td style="white-space:nowrap">{{ item_data.last_built or '—' }}</td>
<td>{{ ui.status_inline(item_data.last_status) }}</td>
