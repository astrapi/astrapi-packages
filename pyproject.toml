[project]
name = "packagectl"
dynamic = ["version"]
description = "Package Control – Web-UI für Arch/Debian/Alpine-Paketbau"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "a2wsgi>=1.10",
    "flask>=3.0",
    "jinja2>=3.1",
    "APScheduler>=3.10",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "requests>=2.32",
    "urllib3>=2.2",
    "psutil>=6.0",
    "apispec>=6.0",
    "astrapi-core>=26.3.12",
]

[project.scripts]
packagectl = "packagectl._cli:main"

[build-system]
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["packagectl*"]

[tool.setuptools.package-data]
packagectl = [
    "app.yaml",
    "navigation.yaml",
    "modules/*/templates/**/*.html",
    "modules/*/schema.yaml",
    "modules/*/modul.yaml",
    "modules/*/settings.yaml",
]
