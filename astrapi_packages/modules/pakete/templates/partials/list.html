<div class="meta-grid">
  <span class="meta-label">Typ</span>
  <span class="meta-value">
    {% if item_data.orphaned %}
      <span class="badge-pill" style="background:rgba(220,38,38,0.15);border-color:rgba(248,113,113,0.25);color:#f87171">Verwaist</span>
    {% elif item_data.pkg_type == 'dependency' %}
      <span class="badge-pill badge-muted">Dep</span>
    {% else %}
      <span class="badge-pill badge-live">Paket</span>
    {% endif %}
  </span>
  {% if item_data.last_version %}
  <span class="meta-label">Version</span>
  <span class="meta-value" style="font-family:var(--mono); font-size:.85em;">{{ item_data.last_version }}</span>
  {% endif %}
  {% if item_data.source_url %}
  <span class="meta-label">URL</span>
  <span class="meta-value col-trunc">
    <a href="{{ item_data.source_url }}" target="_blank" rel="noopener">{{ item_data.source_url }}</a>
  </span>
  {% endif %}
</div>
