<div class="meta-grid">
  {% if item_data.source_url %}
  <span class="meta-label">URL</span>
  <span class="meta-value col-trunc">
    <a href="{{ item_data.source_url }}" target="_blank" rel="noopener">{{ item_data.source_url }}</a>
  </span>
  {% endif %}
  {% if item_data.last_status %}
  <span class="meta-label">Status</span>
  <span class="meta-value">{{ ui.status_inline(item_data.last_status) }}</span>
  {% endif %}
</div>
