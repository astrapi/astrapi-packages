id_field:
  name:        name
  label:       Paketname
  placeholder: "z.B. my-package"
  max:         100

fields:
  - name:        source_url
    label:       AUR Git-URL
    type:        text
    placeholder: "https://aur.archlinux.org/my-package.git"
    max:         500

  - name:        aur_deps
    label:       AUR-Abhängigkeiten
    type:        text
    placeholder: "pkg-a, pkg-b"
    max:         1000

  - name:        pkg_type
    label:       Typ
    type:        select
    options:
      - value: package
        label: Paket
      - value: dependency
        label: Abhängigkeit
    default:     package
