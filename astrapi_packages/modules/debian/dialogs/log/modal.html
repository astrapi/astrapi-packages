{% extends "dialog_info.html" %}

{% block dialog_id %}debian-log-modal{% endblock %}
{% block dialog_width %}780{% endblock %}
{% block dialog_title %}Build-Log – {{ item_id }}{% endblock %}

{% block dialog_body %}
  <pre style="background:var(--bg-2,#1e1e1e); color:var(--text-1,#d4d4d4);
              font-size:12px; line-height:1.5; padding:16px; border-radius:6px;
              overflow:auto; max-height:60vh; white-space:pre-wrap;
              word-break:break-all; margin:12px 0 0;">{{ item_data.last_log or '(kein Log vorhanden)' }}</pre>
{% endblock %}
