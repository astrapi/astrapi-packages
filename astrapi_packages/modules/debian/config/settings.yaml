modal_width: 520

fields:
  - type:  section
    label: Build
    cols:  1

  - key:         default_image
    label:       Standard Build-Image
    type:        text
    placeholder: "ctl/debian-builder:latest"
    default:     "ctl/debian-builder:latest"
    description: "Docker-Image das zum Bauen der Debian-Pakete verwendet wird"

  - type:  section
    label: APT-Repository
    cols:  1

  - key:         distribution
    label:       Standard-Distribution
    type:        text
    placeholder: "bookworm"
    default:     "bookworm"
    description: "Debian-Zieldistribution (z.B. bookworm, bullseye, trixie)"

  - key:         component
    label:       Standard-Komponente
    type:        text
    placeholder: "main"
    default:     "main"
    description: "APT-Komponente (main, contrib, non-free)"

  - type:  section
    label: GPG-Signierung
    cols:  1

  - key:         signing_key_id
    label:       GPG-Key-ID (Signierung)
    type:        text
    placeholder: "packages@simpsons.lan"
    description: "GPG-Key-ID zum Signieren des APT-Repositorys. Leer lassen = kein InRelease/Release.gpg. Schlüssel muss im GPG-Keyring des Dienst-Benutzers vorhanden sein."

  - type:  section
    label: Paketquellen
    cols:  1

  - key:         pkg_repos
    label:       Paket-Repos
    type:        list
    mono:        true
    placeholder: "https://github.com/astrapi/packages_debian"
    description: "URLs zu Repos mit packages.json (GitHub, GitLab, Gitea/Forgejo – oder direkte .json-URL). Wird alle 5 Min. aktualisiert."
