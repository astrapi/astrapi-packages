id_field:
  name:        name
  label:       Paketname
  placeholder: "z.B. mypackage"
  max:         100

fields:
  - name:        source_url
    label:       Git-URL
    type:        text
    placeholder: "https://github.com/example/mypackage.git"
    max:         500

  - name:        pkg_type
    label:       Typ
    type:        select
    options:
      - value: package
        label: Paket
      - value: dependency
        label: Abhängigkeit
    default:     package

  - name:             image
    label:            Build-Image
    type:             select
    options_endpoint:  /api/builder/images/for-select?module=debian
