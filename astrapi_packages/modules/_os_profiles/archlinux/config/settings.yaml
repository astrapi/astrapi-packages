modal_width: 520

fields:
  - type:  section
    label: Build
    cols:  1

  - key:             default_image
    label:            Standard Build-Image
    type:             select
    options_endpoint: /api/builder/images/for-select?module=archlinux
    default:          "ctl/arch-builder:latest"
    description:      "Docker-Image das zum Bauen der Pakete verwendet wird"

  - type:  section
    label: Pacman-Repository
    cols:  1

  - key:         repo_name
    label:       Repository-Name
    type:        text
    placeholder: "pkgctl"
    default:     "pkgctl"
    description: "Name der Pacman-Datenbank (z.B. pkgctl → pkgctl.db.tar.gz). Achtung: 'local' ist von pacman reserviert."

  - type:  section
    label: Paketquellen
    cols:  1

  - key:         pkg_repos
    label:       Paket-Repos
    type:        list
    mono:        true
    placeholder: "https://github.com/astrapi/packages_archlinux"
    description: "URLs zu Repos mit packages.json (GitHub, GitLab, Gitea/Forgejo – oder direkte .json-URL). Wird alle 5 Min. aktualisiert."

  - type:  section
    label: Mirror-Sync
    cols:  1

  - key:         mirror_trigger_url
    label:       Mirror-Sync-URL
    type:        text
    placeholder: "http://mirror-host:8000/archlinux/my-repo/sync"
    description: "URL des Mirror-Endpunkts der nach erfolgreichem Paketbau per POST aufgerufen wird. Leer lassen = kein automatischer Sync."
