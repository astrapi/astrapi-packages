<div id="docker-live-log"
     {% if item_data.last_status == 'building' %}
     hx-get="/ui/docker/{{ item_id }}/log-content"
     hx-trigger="every 2s"
     hx-swap="outerHTML"
     {% endif %}>
  {% if item_data.last_status == 'building' %}
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12px; color:var(--text-2);">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none"
         style="animation:spin 1s linear infinite; flex-shrink:0"><use href="#icon-loading"></use></svg>
    Live – aktualisiert alle 2 Sekunden
  </div>
  {% endif %}
  <pre id="docker-log-pre" style="
    background: var(--bg-2, #1e1e1e);
    color: var(--text-1, #d4d4d4);
    font-size: 12px;
    line-height: 1.5;
    padding: 16px;
    border-radius: 6px;
    overflow: auto;
    max-height: 60vh;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
  ">{{ item_data.last_log or '(Build läuft – noch kein Output …)' }}</pre>
</div>
<script>
(function () {
  var pre = document.getElementById('docker-log-pre');
  if (pre) pre.scrollTop = pre.scrollHeight;
  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (e.detail.target && e.detail.target.id === 'docker-live-log') {
      var p = document.getElementById('docker-log-pre');
      if (p) p.scrollTop = p.scrollHeight;
    }
  });
})();
</script>
