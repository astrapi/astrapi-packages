<div class="meta-grid">
  <span class="meta-label">Typ</span>
  <span class="meta-value">{{ item_data.typ or 'aur' }}</span>
  {% if item_data.typ != 'custom' %}
  <span class="meta-label">URL</span>
  <span class="meta-value col-trunc">{{ item_data.source_url or '—' }}</span>
  {% endif %}
  {% if item_data.last_status %}
  <span class="meta-label">Status</span>
  <span class="meta-value">{{ ui.status_inline(item_data.last_status) }}</span>
  {% endif %}
</div>
