<div class="meta-grid">
  <span class="meta-label">Image</span>
  <span class="meta-value">{{ item_data.image or '—' }}:{{ item_data.tag or 'latest' }}</span>
  <span class="meta-label">Dockerfile</span>
  <span class="meta-value">{{ item_data.dockerfile or '—' }}</span>
  {% if item_data.last_status %}
  <span class="meta-label">Status</span>
  <span class="meta-value">{{ ui.status_inline(item_data.last_status) }}</span>
  {% endif %}
</div>
